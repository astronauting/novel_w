name: Bug report / 问题反馈
description: 报告可复现的问题，请勿上传私人文稿或配置。
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: environment
    attributes:
      label: 环境与版本
      description: Windows 版本、应用提交/版本、构建方式（MSVC/MinGW）。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请使用脱敏的最小文稿或截图。
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 预期与实际结果
    validations:
      required: true
